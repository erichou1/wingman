name: Wingman

options:
  bundleIdPrefix: com.naitikgupta
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

# Secrets.xcconfig is gitignored (see Secrets.xcconfig.example). It supplies
# NVIDIA_API_KEY, injected into Info.plist below so the app can read it via
# Bundle.main at runtime without ever hardcoding it in source.
configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig

settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: 4TG2BX9HR2
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  WingmanCore:
    type: framework
    platform: iOS
    sources:
      - path: App/Shared/WingmanCore
      - path: App/Resources/WingmanCore/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.naitikgupta.wingman.core
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  WingmanMessages:
    type: app-extension
    platform: iOS
    sources:
      - path: App/WingmanMessages
      - path: App/Shared/WingmanDesignSystem
      - path: App/Resources/WingmanMessages/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: WingmanCore
    info:
      path: Generated/WingmanMessages-Info.plist
      properties:
        CFBundleDisplayName: Wingman
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        MSSupportedPresentationContexts:
          - MSMessagesAppPresentationContextMessages
        NVIDIA_API_KEY: $(NVIDIA_API_KEY)
        RENDER_WORKFLOW_URL: $(RENDER_WORKFLOW_URL)
        WINGMAN_SYNC_BASE_URL: $(WINGMAN_SYNC_BASE_URL)
        WINGMAN_GATEWAY_TOKEN: $(WINGMAN_GATEWAY_TOKEN)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.message-payload-provider
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessagesViewController
    entitlements:
      path: Generated/WingmanMessages.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.naitikgupta.wingman
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.naitikgupta.wingman.messages
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  Wingman:
    type: application
    platform: iOS
    sources:
      - path: App/WingmanApp
      - path: App/Shared/WingmanDesignSystem
      - path: App/Resources/WingmanApp
        buildPhase: resources
    dependencies:
      - target: WingmanCore
      - target: WingmanMessages
    info:
      path: Generated/Wingman-Info.plist
      properties:
        CFBundleDisplayName: Wingman
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NVIDIA_API_KEY: $(NVIDIA_API_KEY)
        RENDER_WORKFLOW_URL: $(RENDER_WORKFLOW_URL)
        WINGMAN_SYNC_BASE_URL: $(WINGMAN_SYNC_BASE_URL)
        WINGMAN_GATEWAY_TOKEN: $(WINGMAN_GATEWAY_TOKEN)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Wingman connects to the profile-sync gateway on your Mac during a private development test.
        LSApplicationCategoryType: public.app-category.social-networking
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.naitikgupta.wingman
            CFBundleURLSchemes:
              - wingman
    entitlements:
      path: Generated/Wingman.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.naitikgupta.wingman
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.naitikgupta.wingman
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"

  WingmanCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/WingmanCoreTests
    dependencies:
      - target: WingmanCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.naitikgupta.wingman.core-tests
        TEST_HOST: ""

schemes:
  Wingman:
    build:
      targets:
        Wingman: all
        WingmanCoreTests: [test]
    test:
      targets:
        - WingmanCoreTests
      gatherCoverageData: true
